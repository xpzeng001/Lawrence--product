<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot 7 Keyframes</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 36px rgba(44, 36, 33, 0.08);
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        color: var(--primary);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Shot 7 关键帧预览</h1>
          <p>合同审查 · 法律研究 · 企业尽调 · 合规监控 · 1920×1080 · HyperFrames</p>
        </div>
        <a href="video-preview.html">视频预览</a>
      </header>
      <section class="grid">
        <figure>
          <figcaption><span>0.5s</span><span>合同审查界面入场</span></figcaption>
          <img src="snapshots/s7/frame-00-at-0.5s.png" alt="Shot 7 keyframe at 0.5 seconds" />
        </figure>
        <figure>
          <figcaption><span>2.0s</span><span>合同风险定位完成</span></figcaption>
          <img src="snapshots/s7/frame-01-at-2.0s.png" alt="Shot 7 keyframe at 2.0 seconds" />
        </figure>
        <figure>
          <figcaption><span>4.2s</span><span>法律研究界面切入</span></figcaption>
          <img src="snapshots/s7/frame-02-at-4.2s.png" alt="Shot 7 keyframe at 4.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>5.8s</span><span>引用关系图展开</span></figcaption>
          <img src="snapshots/s7/frame-03-at-5.8s.png" alt="Shot 7 keyframe at 5.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>7.9s</span><span>企业尽调界面切入</span></figcaption>
          <img src="snapshots/s7/frame-04-at-7.9s.png" alt="Shot 7 keyframe at 7.9 seconds" />
        </figure>
        <figure>
          <figcaption><span>9.5s</span><span>企业关系穿透</span></figcaption>
          <img src="snapshots/s7/frame-05-at-9.5s.png" alt="Shot 7 keyframe at 9.5 seconds" />
        </figure>
        <figure>
          <figcaption><span>11.6s</span><span>合规监控界面切入</span></figcaption>
          <img src="snapshots/s7/frame-06-at-11.6s.png" alt="Shot 7 keyframe at 11.6 seconds" />
        </figure>
        <figure>
          <figcaption><span>13.2s</span><span>持续预警与处置</span></figcaption>
          <img src="snapshots/s7/frame-07-at-13.2s.png" alt="Shot 7 keyframe at 13.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>15.2s</span><span>合规监控定格</span></figcaption>
          <img src="snapshots/s7/frame-08-at-15.2s.png" alt="Shot 7 keyframe at 15.2 seconds" />
        </figure>
      </section>
    </main>
  </body>
</html>
