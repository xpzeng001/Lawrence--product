<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot 6 Keyframes</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 36px rgba(44, 36, 33, 0.08);
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        color: var(--primary);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Shot 6 关键帧预览</h1>
          <p>MacBook Pro 展开为数字工位 · 本地数据主权 · 文件切片脱敏 · 1920×1080 · HyperFrames</p>
        </div>
        <a href="video-preview.html">视频预览</a>
      </header>
      <section class="grid">
        <figure>
          <figcaption><span>0.4s</span><span>MacBook Pro 入场</span></figcaption>
          <img src="snapshots/s6/frame-00-at-0.4s.png" alt="Shot 6 keyframe at 0.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>1.6s</span><span>大模型大脑出现</span></figcaption>
          <img src="snapshots/s6/frame-01-at-1.6s.png" alt="Shot 6 keyframe at 1.6 seconds" />
        </figure>
        <figure>
          <figcaption><span>3.8s</span><span>数字工位模块展开</span></figcaption>
          <img src="snapshots/s6/frame-02-at-3.8s.png" alt="Shot 6 keyframe at 3.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>5.2s</span><span>七类工位能力完整展示</span></figcaption>
          <img src="snapshots/s6/frame-03-at-5.2s.png" alt="Shot 6 keyframe at 5.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>7.8s</span><span>本地数据处理进入</span></figcaption>
          <img src="snapshots/s6/frame-04-at-7.8s.png" alt="Shot 6 keyframe at 7.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>9.2s</span><span>原始文件进入本地处理区</span></figcaption>
          <img src="snapshots/s6/frame-05-at-9.2s.png" alt="Shot 6 keyframe at 9.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>10.4s</span><span>文件切片与脱敏</span></figcaption>
          <img src="snapshots/s6/frame-06-at-10.4s.png" alt="Shot 6 keyframe at 10.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>12.8s</span><span>数据主权定格</span></figcaption>
          <img src="snapshots/s6/frame-07-at-12.8s.png" alt="Shot 6 keyframe at 12.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>14.8s</span><span>WiseStudio 数字工位收尾</span></figcaption>
          <img src="snapshots/s6/frame-08-at-14.8s.png" alt="Shot 6 keyframe at 14.8 seconds" />
        </figure>
      </section>
    </main>
  </body>
</html>
