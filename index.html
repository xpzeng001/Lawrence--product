    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #faf8f6;
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      #main {
        position: relative;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
        background: #faf8f6;
      }

      .clip { position: absolute; inset: 0; }

      .shot-comp {
        width: 1920px;
        height: 1080px;
        background: #faf8f6;
        transform-origin: 50% 50%;
        will-change: transform, opacity, filter, clip-path;
      }

      .chapter-video {
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        display: block;
      }

      .chapter-scene-image {
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        display: block;
      }

      .opening-video {
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        background: #000;
        z-index: 1;
      }

      .opening-logo-wrap {
        z-index: 12;
        pointer-events: none;
        opacity: 0;
      }

      .opening-logo-cluster {
        position: absolute;
        left: 1360px;
        top: 258px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 22px 30px;
        border-radius: 28px;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.34));
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.38);
        overflow: hidden;
        backdrop-filter: blur(4px);
      }

      .opening-logo-polyu {
        width: 330px;
        height: auto;
        display: block;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.16));
      }

      .opening-logo-divider {
        width: 2px;
        height: 70px;
        background: linear-gradient(180deg, transparent, rgba(55, 49, 45, 0.34), transparent);
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.34);
        transform-origin: center;
      }

      .opening-wiselaw-panel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .opening-logo-wiselaw {
        width: 270px;
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.18));
      }

      .opening-logo-sheen {
        position: absolute;
        top: -40%;
        bottom: -40%;
        width: 44px;
        left: -70px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
        transform: rotate(18deg);
        opacity: 0;
      }

      .transition-slab,
      .transition-wash,
      .motion-ribbon,
      .pulse-vignette,
      .chapter-hud,
      .wiselaw-logo-mark,
      .chapter-bumper {
        pointer-events: none;
      }

      .transition-slab {
        display: none;
        z-index: 70;
        opacity: 0;
        transform: translateX(-2300px) skewX(-18deg);
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.92) 28%,
          rgba(232,226,220,0.82) 50%,
          rgba(139,90,74,0.18) 62%,
          rgba(255,255,255,0) 100%);
        filter: blur(0.4px);
      }

      .transition-slab.alt {
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(31,159,104,0.12) 30%,
          rgba(255,255,255,0.9) 52%,
          rgba(208,160,79,0.16) 68%,
          rgba(255,255,255,0) 100%);
      }

      .motion-ribbon {
        display: none;
        z-index: 74;
        opacity: 0;
        transform: translateX(-2400px) skewX(-16deg);
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.34) 36%,
          rgba(208,160,79,0.28) 49%,
          rgba(255,255,255,0.76) 60%,
          rgba(255,255,255,0) 100%);
        filter: blur(1px);
      }

      .transition-wash {
        z-index: 68;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0.96), rgba(250,248,246,0.64) 48%, rgba(250,248,246,0));
      }

      .pulse-vignette {
        z-index: 66;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0), rgba(139,90,74,0.06) 60%, rgba(44,36,33,0.16));
        mix-blend-mode: multiply;
      }

      .chapter-hud {
        z-index: 110;
        position: absolute;
        left: 134px;
        top: 60px;
        right: auto;
        width: 940px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
        opacity: 0;
        transform: translateY(-18px);
      }

      .chapter-number {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(139,90,74,0.14);
        border: 1px solid rgba(139,90,74,0.28);
        color: #7b4b3e;
        font-size: 14px;
        font-weight: 950;
      }

      .chapter-copy {
        min-width: 320px;
      }

      .chapter-kicker {
        color: #8b5a4a;
        font-size: 11px;
        font-weight: 950;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .chapter-title {
        margin-top: 2px;
        color: #2c2421;
        font-size: 19px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .chapter-subtitle {
        margin-top: 7px;
        color: #6f625c;
        font-size: 13px;
        line-height: 1;
        font-weight: 760;
        letter-spacing: 0;
      }

      .chapter-rail {
        position: relative;
        flex: 1;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(139,90,74,0.12);
      }

      .chapter-rail-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, #8b5a4a, #d0a04f, #1f9f68);
      }

      .wiselaw-logo-mark {
        z-index: 110;
        position: absolute;
        left: auto;
        right: 86px;
        top: 60px;
        height: 54px;
        width: 220px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        opacity: 0;
        transform: translateY(-18px);
      }

      .wiselaw-logo-mark img {
        display: block;
        width: 190px;
        height: auto;
        max-height: 48px;
        object-fit: contain;
        opacity: 1;
        filter: contrast(1.2) saturate(1.05);
      }

      .chapter-bumper {
        z-index: 105;
        opacity: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0.94), rgba(250,248,246,0.84) 42%, rgba(250,248,246,0.46) 70%, rgba(250,248,246,0.1)),
          linear-gradient(115deg, rgba(255,255,255,0.8), rgba(245,242,239,0.74));
        backdrop-filter: blur(10px);
      }

      .bumper-inner {
        display: flex;
        align-items: center;
        gap: 34px;
        min-width: 820px;
        padding: 42px 64px 42px 48px;
        border-radius: 34px;
        border: 1px solid rgba(232,226,220,0.92);
        background: rgba(255,255,255,0.9);
        box-shadow: 0 36px 110px rgba(44,36,33,0.16);
        backdrop-filter: blur(18px);
      }

      .bumper-index {
        width: 86px;
        height: 86px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(135deg, #8b5a4a, #74493c);
        box-shadow: 0 20px 48px rgba(139,90,74,0.24);
        font-size: 24px;
        font-weight: 950;
      }

      .bumper-text b {
        display: block;
        color: #2c2421;
        font-size: 58px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .bumper-text span {
        display: block;
        margin-top: 14px;
        color: #6d625c;
        font-size: 22px;
        font-weight: 850;
        letter-spacing: 0.02em;
      }
    </style>
