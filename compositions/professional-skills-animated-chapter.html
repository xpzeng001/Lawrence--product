<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Professional Skills Animated Chapter</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #faf8f6;
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      #professional-skills-animated-chapter {
        position: relative;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
        background:
          linear-gradient(90deg, rgba(139, 90, 74, 0.05) 1px, transparent 1px),
          linear-gradient(180deg, rgba(139, 90, 74, 0.04) 1px, transparent 1px),
          #faf8f6;
        background-size: 160px 160px;
        color: #2c2421;
      }

      .clip { position: absolute; inset: 0; }

      .shot-comp {
        width: 1920px;
        height: 1080px;
        background: #faf8f6;
      }

      .hud,
      .wiselaw-lockup {
        pointer-events: none;
        z-index: 40;
      }

      .hud {
        position: absolute;
        left: 112px;
        top: 70px;
        right: auto;
        bottom: auto;
        display: grid;
        grid-template-columns: 44px auto;
        gap: 16px;
        align-items: center;
        color: #2c2421;
      }

      .hud-index {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(139, 90, 74, 0.18);
        background: rgba(255,255,255,0.68);
        color: #8b5a4a;
        font-size: 16px;
        font-weight: 920;
        box-shadow: 0 12px 34px rgba(44,36,33,0.07);
      }

      .hud-copy {
        display: grid;
        gap: 4px;
      }

      .hud-kicker {
        color: #9f6b5a;
        font-size: 13px;
        font-weight: 920;
        letter-spacing: 0.08em;
      }

      .hud-title {
        color: #2c2421;
        font-size: 20px;
        font-weight: 920;
      }

      .hud-rail {
        position: absolute;
        left: 515px;
        top: 93px;
        right: auto;
        bottom: auto;
        width: 560px;
        height: 3px;
        border-radius: 999px;
        background: rgba(139,90,74,0.12);
        overflow: hidden;
        z-index: 40;
      }

      .hud-rail-fill {
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #8b5a4a, #d0a04f, #1f9f68);
        border-radius: inherit;
      }

      .wiselaw-lockup {
        position: absolute;
        right: 118px;
        top: 66px;
        left: auto;
        bottom: auto;
        width: 184px;
        height: auto;
        display: block;
      }

      .chapter-card,
      .closing-card {
        display: grid;
        place-items: center;
        padding: 96px;
        z-index: 12;
      }

      .panel {
        width: min(1180px, 78vw);
        min-height: 330px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        border-radius: 34px;
        border: 1px solid rgba(139, 90, 74, 0.12);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(245, 242, 239, 0.72));
        box-shadow: 0 42px 120px rgba(44, 36, 33, 0.1);
      }

      .kicker {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9f6b5a;
      }

      h1 {
        margin: 0;
        font-size: 104px;
        line-height: 1;
        font-weight: 950;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        font-size: 30px;
        line-height: 1.45;
        font-weight: 760;
        color: rgba(44, 36, 33, 0.58);
      }

      .closing-card {
        place-items: stretch;
        padding: 152px 176px 120px;
        background:
          radial-gradient(circle at 80% 28%, rgba(139,90,74,0.12), transparent 34%),
          radial-gradient(circle at 22% 72%, rgba(31,159,104,0.08), transparent 30%);
      }

      .closing-wrap {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
        align-items: center;
        gap: 58px;
      }

      .closing-main {
        max-width: 1220px;
      }

      .closing-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #8b5a4a;
        font-size: 22px;
        font-weight: 930;
        letter-spacing: 0.08em;
      }

      .closing-eyebrow::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #8b5a4a;
        box-shadow: 0 0 0 9px rgba(139,90,74,0.1);
      }

      .closing-title {
        margin: 32px 0 0;
        max-width: 1180px;
        color: #2c2421;
        font-size: 78px;
        line-height: 1.16;
        font-weight: 950;
        letter-spacing: 0;
      }

      .closing-title span {
        color: #8b5a4a;
      }

      .closing-rule {
        margin-top: 42px;
        width: 680px;
        height: 5px;
        border-radius: 999px;
        background: linear-gradient(90deg, #8b5a4a, #d0a04f, #1f9f68);
      }

      .closing-points {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .closing-point {
        min-height: 132px;
        padding: 26px 28px;
        border-radius: 24px;
        border: 1px solid rgba(139,90,74,0.12);
        background: rgba(255,255,255,0.72);
        box-shadow: 0 20px 54px rgba(44,36,33,0.07);
      }

      .closing-point b {
        display: block;
        color: #2c2421;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 930;
      }

      .closing-point span {
        display: block;
        margin-top: 12px;
        color: rgba(92,82,77,0.8);
        font-size: 16px;
        line-height: 1.45;
        font-weight: 740;
      }
    </style>
  </head>
  <body>
    <div
      id="professional-skills-animated-chapter"
      data-composition-id="professional-skills-animated-chapter"
      data-start="0"
      data-duration="78"
      data-width="1920"
      data-height="1080"
      >
      <div class="hud clip" id="chapter-hud" data-start="0" data-duration="78" data-track-index="50">
        <div class="hud-index">05</div>
        <div class="hud-copy">
          <div class="hud-kicker">CAPABILITY MAP</div>
          <div class="hud-title">专业技能</div>
        </div>
      </div>
      <div class="hud-rail clip" id="hud-rail" data-start="0" data-duration="78" data-track-index="51">
        <div class="hud-rail-fill" id="hud-rail-fill"></div>
      </div>
      <img class="wiselaw-lockup clip" id="wiselaw-lockup" data-start="0" data-duration="78" data-track-index="52" src="assets/wiselaw-logo.svg" alt="WiseLaw" />

      <section id="chapter-intro" class="clip chapter-card" data-start="0" data-duration="5" data-track-index="1">
        <div class="panel">
          <div class="kicker">CAPABILITY MAP</div>
          <h1>专业技能</h1>
          <p>法律合规、管理执行与营销增长</p>
        </div>
      </section>

      <div
        id="shot-07-professional-render-clip"
        class="clip shot-comp"
        data-composition-id="shot-07-professional-render"
        data-composition-src="shots/shot-07-professional-render.html"
        data-start="5"
        data-duration="25"
        data-track-index="2"
        data-layout-allow-overflow="true"
      ></div>

      <div
        id="shot-08-professional-render-clip"
        class="clip shot-comp"
        data-composition-id="shot-08-professional-render"
        data-composition-src="shots/shot-08-professional-render.html"
        data-start="30"
        data-duration="42"
        data-track-index="3"
        data-layout-allow-overflow="true"
      ></div>

      <section id="chapter-closing" class="clip closing-card" data-start="72" data-duration="6" data-track-index="4">
        <div class="closing-wrap">
          <div class="closing-main">
            <div class="closing-eyebrow">WISELAW AI DIGITAL WORKER</div>
            <h1 class="closing-title">让专业能力沉入流程，<br /><span>让每一次业务动作都有据可依。</span></h1>
            <div class="closing-rule"></div>
          </div>
          <div class="closing-points">
            <div class="closing-point"><b>专业判断</b><span>把法律、管理和营销能力嵌入真实工作流。</span></div>
            <div class="closing-point"><b>过程留痕</b><span>每一步输入、依据和结论都能追踪复核。</span></div>
            <div class="closing-point"><b>持续交付</b><span>从单点任务走向稳定、可复用的业务执行。</span></div>
          </div>
        </div>
      </section>

      <audio id="skill-vo-01" data-start="0.5" data-duration="4.122" data-track-index="220" src="assets/professional-skills-vo/line-01.wav" data-volume="1"></audio>
      <audio id="skill-vo-02" data-start="5.5" data-duration="4.282" data-track-index="220" src="assets/professional-skills-vo/line-02.wav" data-volume="1"></audio>
      <audio id="skill-vo-03" data-start="10.5" data-duration="4.719" data-track-index="220" src="assets/professional-skills-vo/line-03.wav" data-volume="1"></audio>
      <audio id="skill-vo-04" data-start="15.5" data-duration="4.463" data-track-index="220" src="assets/professional-skills-vo/line-04.wav" data-volume="1"></audio>
      <audio id="skill-vo-05" data-start="20.5" data-duration="4.394" data-track-index="220" src="assets/professional-skills-vo/line-05.wav" data-volume="1"></audio>
      <audio id="skill-vo-06" data-start="25.5" data-duration="4.591" data-track-index="220" src="assets/professional-skills-vo/line-06.wav" data-volume="1"></audio>
      <audio id="skill-vo-07" data-start="30.5" data-duration="3.802" data-track-index="220" src="assets/professional-skills-vo/line-07.wav" data-volume="1"></audio>
      <audio id="skill-vo-08" data-start="35.5" data-duration="4.607" data-track-index="220" src="assets/professional-skills-vo/line-08.wav" data-volume="1"></audio>
      <audio id="skill-vo-09" data-start="40.5" data-duration="4.426" data-track-index="220" src="assets/professional-skills-vo/line-09.wav" data-volume="1"></audio>
      <audio id="skill-vo-10" data-start="45.5" data-duration="4.922" data-track-index="220" src="assets/professional-skills-vo/line-10.wav" data-volume="1"></audio>
      <audio id="skill-vo-11" data-start="50.5" data-duration="4.314" data-track-index="220" src="assets/professional-skills-vo/line-11.wav" data-volume="1"></audio>
      <audio id="skill-vo-12" data-start="55.5" data-duration="4.687" data-track-index="220" src="assets/professional-skills-vo/line-12.wav" data-volume="1"></audio>
      <audio id="skill-vo-13" data-start="60.5" data-duration="4.410" data-track-index="220" src="assets/professional-skills-vo/line-13.wav" data-volume="1"></audio>
      <audio id="skill-vo-14" data-start="65.5" data-duration="4.746" data-track-index="220" src="assets/professional-skills-vo/line-14.wav" data-volume="1"></audio>
      <audio id="skill-vo-15" data-start="72.5" data-duration="4.191" data-track-index="220" src="assets/professional-skills-vo/line-15.wav" data-volume="1"></audio>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(["#chapter-hud", "#hud-rail", "#wiselaw-lockup"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.14)
        .fromTo("#hud-rail-fill", { scaleX: 0 }, { scaleX: 1, duration: 78, ease: "none" }, 0.2)
        .fromTo("#chapter-intro .panel", { opacity: 0, y: 38, scale: 0.96, filter: "blur(14px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.72, ease: "expo.out" }, 0.36)
        .from("#chapter-intro .kicker", { opacity: 0, y: 16, duration: 0.34 }, 0.7)
        .from("#chapter-intro h1", { opacity: 0, y: 30, duration: 0.5, ease: "expo.out" }, 0.94)
        .from("#chapter-intro p", { opacity: 0, y: 18, duration: 0.42 }, 1.22)
        .to("#chapter-intro", { opacity: 0, y: -28, scale: 1.03, filter: "blur(10px)", duration: 0.42, ease: "power2.inOut" }, 4.35)
        .fromTo("#chapter-closing", { opacity: 0, y: 18, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.72, ease: "power3.out" }, 72)
        .from("#chapter-closing .closing-eyebrow", { opacity: 0, y: 16, duration: 0.34 }, 72.36)
        .from("#chapter-closing .closing-title", { opacity: 0, y: 34, duration: 0.62, ease: "expo.out" }, 72.62)
        .from("#chapter-closing .closing-rule", { opacity: 0, scaleX: 0, transformOrigin: "left center", duration: 0.54, ease: "power3.out" }, 73.06)
        .from("#chapter-closing .closing-point", { opacity: 0, y: 24, scale: 0.97, duration: 0.52, stagger: 0.1, ease: "power3.out" }, 73.34);

      window.__timelines["professional-skills-animated-chapter"] = tl;
    </script>
  </body>
