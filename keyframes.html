<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S7&S8 Keyframes</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 36px rgba(44, 36, 33, 0.08);
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        color: var(--primary);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>S7&S8 关键帧预览</h1>
          <p>原界面布局节奏优化 · 卡片滚动 · 弹性出现 · 轻微镜头运动 · 1920×1080 · HyperFrames</p>
        </div>
        <a href="video-preview.html">视频预览</a>
      </header>
      <section class="grid">
        <figure>
          <figcaption><span>0.5s</span><span>会议纪要界面入场</span></figcaption>
          <img src="snapshots/s7s8/frame-0.5.png" alt="S7&S8 keyframe at 0.5 seconds" />
        </figure>
        <figure>
          <figcaption><span>1.2s</span><span>卡片滚动与弹性出现</span></figcaption>
          <img src="snapshots/s7s8/frame-1.2.png" alt="S7&S8 keyframe at 1.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>2.5s</span><span>客户简报生成</span></figcaption>
          <img src="snapshots/s7s8/frame-2.5.png" alt="S7&S8 keyframe at 2.5 seconds" />
        </figure>
        <figure>
          <figcaption><span>4.7s</span><span>邮件起草界面</span></figcaption>
          <img src="snapshots/s7s8/frame-4.7.png" alt="S7&S8 keyframe at 4.7 seconds" />
        </figure>
        <figure>
          <figcaption><span>7.0s</span><span>项目汇报看板</span></figcaption>
          <img src="snapshots/s7s8/frame-7.0.png" alt="S7&S8 keyframe at 7.0 seconds" />
        </figure>
        <figure>
          <figcaption><span>9.2s</span><span>新媒体文案多平台适配</span></figcaption>
          <img src="snapshots/s7s8/frame-9.2.png" alt="S7&S8 keyframe at 9.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>11.5s</span><span>视频脚本分镜拆分</span></figcaption>
          <img src="snapshots/s7s8/frame-11.5.png" alt="S7&S8 keyframe at 11.5 seconds" />
        </figure>
        <figure>
          <figcaption><span>13.2s</span><span>最终输出画面</span></figcaption>
          <img src="snapshots/s7s8/frame-13.2.png" alt="S7&S8 keyframe at 13.2 seconds" />
        </figure>
      </section>
    </main>
  </body>
</html>
