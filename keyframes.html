<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot 4 Keyframes</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 36px rgba(44, 36, 33, 0.08);
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        color: var(--primary);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Shot 4 关键帧预览</h1>
          <p>手机端飞书聊天 · 语音/文字下任务 · 文件发送 · 1920×1080 · HyperFrames</p>
        </div>
        <a href="video-preview.html">视频预览</a>
      </header>
      <section class="grid">
        <figure>
          <figcaption><span>1.2s</span><span>主标题进入</span></figcaption>
          <img src="snapshots/s4/frame-00-at-1.2s.png" alt="Shot 4 keyframe at 1.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>2.6s</span><span>任务入口说明</span></figcaption>
          <img src="snapshots/s4/frame-01-at-2.6s.png" alt="Shot 4 keyframe at 2.6 seconds" />
        </figure>
        <figure>
          <figcaption><span>4.8s</span><span>手机与能力面板入场</span></figcaption>
          <img src="snapshots/s4/frame-02-at-4.8s.png" alt="Shot 4 keyframe at 4.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>5.8s</span><span>语音指令发送</span></figcaption>
          <img src="snapshots/s4/frame-03-at-5.8s.png" alt="Shot 4 keyframe at 5.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>7.2s</span><span>Lawrence 接收指令</span></figcaption>
          <img src="snapshots/s4/frame-04-at-7.2s.png" alt="Shot 4 keyframe at 7.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>8.8s</span><span>文字说明和 PDF 文件</span></figcaption>
          <img src="snapshots/s4/frame-05-at-8.8s.png" alt="Shot 4 keyframe at 8.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>10.4s</span><span>补充案例与截止时间</span></figcaption>
          <img src="snapshots/s4/frame-06-at-10.4s.png" alt="Shot 4 keyframe at 10.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>12.4s</span><span>完整任务链路定格</span></figcaption>
          <img src="snapshots/s4/frame-07-at-12.4s.png" alt="Shot 4 keyframe at 12.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>14.0s</span><span>收尾光扫</span></figcaption>
          <img src="snapshots/s4/frame-08-at-14.0s.png" alt="Shot 4 keyframe at 14.0 seconds" />
        </figure>
      </section>
    </main>
  </body>
</html>
