<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lawrence Storyboard Keyframes</title>
    <style>
      :root {
        --bg: #faf8f6;
        --ink: #2c2421;
        --muted: #675e59;
        --line: #e8e1dc;
        --primary: #8b5a4a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 8%, rgba(210, 164, 79, 0.1), transparent 34%),
          linear-gradient(rgba(139, 90, 74, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 90, 74, 0.035) 1px, transparent 1px),
          var(--bg);
        background-size: auto, 92px 70px, 92px 70px, auto;
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 64px 40px 80px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 32px;
        margin-bottom: 36px;
      }

      h1 {
        margin: 0;
        font-size: 48px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 18px;
        font-weight: 760;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 900;
      }

      .button {
        display: inline-flex;
        align-items: center;
        height: 42px;
        padding: 0 16px;
        border: 1px solid rgba(139, 90, 74, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 56px rgba(44, 36, 33, 0.08);
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #eee9e4;
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 22px;
        border-top: 1px solid var(--line);
        font-size: 17px;
        font-weight: 900;
      }

      figcaption span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 780;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Lawrence 分镜关键帧</h1>
          <p>用于快速核对每个已纳入分镜的视觉状态；S7 和 S8 使用合并版 S7&S8。</p>
        </div>
        <a class="button" href="video-preview.html">视频预览</a>
      </header>

      <section class="grid">
        <figure>
          <img src="snapshots/frame-08-at-16.4s.png" alt="Shot 3 keyframe" />
          <figcaption>Shot 3 · 身份与定位 <span>shots/shot-03.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s4/frame-08-at-14.0s.png" alt="Shot 4 keyframe" />
          <figcaption>Shot 4 · 飞书下任务 <span>shots/shot-04.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s5/frame-08-at-11.2s.png" alt="Shot 5 keyframe" />
          <figcaption>Shot 5 · 后台执行 <span>shots/shot-05.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s6/frame-08-at-14.8s.png" alt="Shot 6 keyframe" />
          <figcaption>Shot 6 · 数字工位 <span>shots/shot-06.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s7s8/frame-13.2.png" alt="Shot 7 and 8 keyframe" />
          <figcaption>Shot 7&8 · 能力快闪 <span>shots/shot-07-08.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s9s10/frame-15.2.png" alt="Shot 9 and 10 keyframe" />
          <figcaption>Shot 9&10 · 合规与 Skill Hub <span>shots/shot-09-10.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s11s12/frame-15.2.png" alt="Shot 11 and 12 keyframe" />
          <figcaption>Shot 11&12 · 安全与主权 <span>shots/shot-11-12.html</span></figcaption>
        </figure>
        <figure>
          <img src="snapshots/s13/frame-15.2.png" alt="Shot 13 keyframe" />
          <figcaption>Shot 13 · 课程与陪跑 <span>shots/shot-13.html</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
