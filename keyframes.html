<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot 8 Keyframes</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 36px rgba(44, 36, 33, 0.08);
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        color: var(--primary);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Shot 8 关键帧预览</h1>
          <p>会议纪要 · 客户简报 · 邮件起草 · 项目汇报 · 新媒体文案 · 视频脚本 · 1920×1080 · HyperFrames</p>
        </div>
        <a href="video-preview.html">视频预览</a>
      </header>
      <section class="grid">
        <figure>
          <figcaption><span>0.6s</span><span>会议纪要界面入场</span></figcaption>
          <img src="snapshots/s8/frame-00-at-0.6s.png" alt="Shot 8 keyframe at 0.6 seconds" />
        </figure>
        <figure>
          <figcaption><span>2.9s</span><span>客户简报生成</span></figcaption>
          <img src="snapshots/s8/frame-01-at-2.9s.png" alt="Shot 8 keyframe at 2.9 seconds" />
        </figure>
        <figure>
          <figcaption><span>5.4s</span><span>邮件起草界面</span></figcaption>
          <img src="snapshots/s8/frame-02-at-5.4s.png" alt="Shot 8 keyframe at 5.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>7.9s</span><span>项目汇报看板</span></figcaption>
          <img src="snapshots/s8/frame-03-at-7.9s.png" alt="Shot 8 keyframe at 7.9 seconds" />
        </figure>
        <figure>
          <figcaption><span>10.4s</span><span>新媒体文案多平台适配</span></figcaption>
          <img src="snapshots/s8/frame-04-at-10.4s.png" alt="Shot 8 keyframe at 10.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>12.9s</span><span>视频脚本分镜拆分</span></figcaption>
          <img src="snapshots/s8/frame-05-at-12.9s.png" alt="Shot 8 keyframe at 12.9 seconds" />
        </figure>
        <figure>
          <figcaption><span>14.8s</span><span>视频脚本定格</span></figcaption>
          <img src="snapshots/s8/frame-06-at-14.8s.png" alt="Shot 8 keyframe at 14.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>15.6s</span><span>办公与营销工作流收尾</span></figcaption>
          <img src="snapshots/s8/frame-07-at-15.6s.png" alt="Shot 8 keyframe at 15.6 seconds" />
        </figure>
        <figure>
          <figcaption><span>15.9s</span><span>最终输出画面</span></figcaption>
          <img src="snapshots/s8/frame-08-at-15.9s.png" alt="Shot 8 keyframe at 15.9 seconds" />
        </figure>
      </section>
    </main>
  </body>
</html>
