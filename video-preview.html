<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot 5 Video Preview</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgba(139, 90, 74, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 90, 74, 0.045) 1px, transparent 1px),
          var(--background);
        background-size: 96px 72px;
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 48px));
        margin: 0 auto;
        padding: 36px 0 56px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 650;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .player {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 18px 52px rgba(44, 36, 33, 0.12);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0d0c0b;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Shot 5 视频预览</h1>
          <p>拖动播放器进度条即可检查转场和节奏。</p>
        </div>
        <a href="keyframes.html">关键帧</a>
      </header>

      <section class="player">
        <video controls preload="metadata" src="renders/shot-5-background-execution.mp4"></video>
      </section>
    </main>
  </body>
</html>
