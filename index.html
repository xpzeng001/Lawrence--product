    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #faf8f6;
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      #main {
        position: relative;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
        background: #faf8f6;
      }

      .clip { position: absolute; inset: 0; }

      .shot-comp {
        width: 1920px;
        height: 1080px;
        background: #faf8f6;
        transform-origin: 50% 50%;
        will-change: transform, opacity, filter, clip-path;
      }

      .transition-slab,
      .transition-wash,
      .motion-ribbon,
      .pulse-vignette,
      .chapter-hud,
      .wiselaw-logo-mark,
      .chapter-bumper {
        pointer-events: none;
      }

      .transition-slab {
        display: none;
        z-index: 70;
        opacity: 0;
        transform: translateX(-2300px) skewX(-18deg);
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.92) 28%,
          rgba(232,226,220,0.82) 50%,
          rgba(139,90,74,0.18) 62%,
          rgba(255,255,255,0) 100%);
        filter: blur(0.4px);
      }

      .transition-slab.alt {
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(31,159,104,0.12) 30%,
          rgba(255,255,255,0.9) 52%,
          rgba(208,160,79,0.16) 68%,
          rgba(255,255,255,0) 100%);
      }

      .motion-ribbon {
        display: none;
        z-index: 74;
        opacity: 0;
        transform: translateX(-2400px) skewX(-16deg);
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.34) 36%,
          rgba(208,160,79,0.28) 49%,
          rgba(255,255,255,0.76) 60%,
          rgba(255,255,255,0) 100%);
        filter: blur(1px);
      }

      .transition-wash {
        z-index: 68;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0.96), rgba(250,248,246,0.64) 48%, rgba(250,248,246,0));
      }

      .pulse-vignette {
        z-index: 66;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0), rgba(139,90,74,0.06) 60%, rgba(44,36,33,0.16));
        mix-blend-mode: multiply;
      }

      .chapter-hud {
        z-index: 110;
        position: absolute;
        left: 134px;
        top: 60px;
        right: auto;
        width: 870px;
        height: 54px;
        display: flex;
        align-items: center;
        gap: 18px;
        opacity: 0;
        transform: translateY(-18px);
      }

      .chapter-number {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(139,90,74,0.1);
        border: 1px solid rgba(139,90,74,0.18);
        color: #8b5a4a;
        font-size: 14px;
        font-weight: 950;
      }

      .chapter-copy {
        min-width: 280px;
      }

      .chapter-kicker {
        color: rgba(139,90,74,0.82);
        font-size: 11px;
        font-weight: 950;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .chapter-title {
        margin-top: 2px;
        color: #2c2421;
        font-size: 19px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .chapter-rail {
        position: relative;
        flex: 1;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(139,90,74,0.12);
      }

      .chapter-rail-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, #8b5a4a, #d0a04f, #1f9f68);
      }

      .wiselaw-logo-mark {
        z-index: 110;
        position: absolute;
        left: auto;
        right: 86px;
        top: 60px;
        height: 54px;
        width: 220px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        opacity: 0;
        transform: translateY(-18px);
      }

      .wiselaw-logo-mark img {
        display: block;
        width: 190px;
        height: auto;
        max-height: 48px;
        object-fit: contain;
      }

      .chapter-bumper {
        z-index: 105;
        opacity: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0.94), rgba(250,248,246,0.84) 42%, rgba(250,248,246,0.46) 70%, rgba(250,248,246,0.1)),
          linear-gradient(115deg, rgba(255,255,255,0.8), rgba(245,242,239,0.74));
        backdrop-filter: blur(10px);
      }

      .bumper-inner {
        display: flex;
        align-items: center;
        gap: 34px;
        min-width: 720px;
        padding: 36px 54px 36px 42px;
        border-radius: 34px;
        border: 1px solid rgba(232,226,220,0.92);
        background: rgba(255,255,255,0.9);
        box-shadow: 0 36px 110px rgba(44,36,33,0.16);
        backdrop-filter: blur(18px);
      }

      .bumper-index {
        width: 86px;
        height: 86px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(135deg, #8b5a4a, #74493c);
        box-shadow: 0 20px 48px rgba(139,90,74,0.24);
        font-size: 24px;
        font-weight: 950;
      }

      .bumper-text b {
        display: block;
        color: #2c2421;
        font-size: 58px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .bumper-text span {
        display: block;
        margin-top: 14px;
        color: #6d625c;
        font-size: 22px;
        font-weight: 850;
        letter-spacing: 0.02em;
      }
    </style>
