<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot 5 Keyframes</title>
    <style>
      :root {
        --background: #faf8f6;
        --foreground: #2c2421;
        --primary: #8b5a4a;
        --muted: #5c524d;
        --border: #e8e2dc;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      a {
        color: var(--primary);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 36px rgba(44, 36, 33, 0.08);
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        color: var(--primary);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Shot 5 关键帧预览</h1>
          <p>飞书任务输入 · Lawrence 工作电脑后台执行 · 结果返回飞书 · 1920×1080 · HyperFrames</p>
        </div>
        <a href="video-preview.html">视频预览</a>
      </header>
      <section class="grid">
        <figure>
          <figcaption><span>0.2s</span><span>承接 S4 的飞书聊天</span></figcaption>
          <img src="snapshots/s5/frame-00-at-0.2s.png" alt="Shot 5 keyframe at 0.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>1.0s</span><span>Lawrence 接收任务</span></figcaption>
          <img src="snapshots/s5/frame-01-at-1.0s.png" alt="Shot 5 keyframe at 1.0 seconds" />
        </figure>
        <figure>
          <figcaption><span>2.0s</span><span>任务流转到后台</span></figcaption>
          <img src="snapshots/s5/frame-02-at-2.0s.png" alt="Shot 5 keyframe at 2.0 seconds" />
        </figure>
        <figure>
          <figcaption><span>3.2s</span><span>工作电脑开始执行</span></figcaption>
          <img src="snapshots/s5/frame-03-at-3.2s.png" alt="Shot 5 keyframe at 3.2 seconds" />
        </figure>
        <figure>
          <figcaption><span>4.8s</span><span>分析结果生成</span></figcaption>
          <img src="snapshots/s5/frame-04-at-4.8s.png" alt="Shot 5 keyframe at 4.8 seconds" />
        </figure>
        <figure>
          <figcaption><span>6.4s</span><span>完成并返回</span></figcaption>
          <img src="snapshots/s5/frame-05-at-6.4s.png" alt="Shot 5 keyframe at 6.4 seconds" />
        </figure>
        <figure>
          <figcaption><span>7.6s</span><span>结果返回飞书</span></figcaption>
          <img src="snapshots/s5/frame-06-at-7.6s.png" alt="Shot 5 keyframe at 7.6 seconds" />
        </figure>
        <figure>
          <figcaption><span>9.0s</span><span>底部说明出现</span></figcaption>
          <img src="snapshots/s5/frame-07-at-9.0s.png" alt="Shot 5 keyframe at 9.0 seconds" />
        </figure>
        <figure>
          <figcaption><span>11.2s</span><span>完整链路定格</span></figcaption>
          <img src="snapshots/s5/frame-08-at-11.2s.png" alt="Shot 5 keyframe at 11.2 seconds" />
        </figure>
      </section>
    </main>
  </body>
</html>
